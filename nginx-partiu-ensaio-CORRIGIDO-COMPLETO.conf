# Redirecionar HTTP para HTTPS (um único bloco para ambos os domínios)
server {
    listen 80;
    server_name partiuensaio.automatizeonline.com.br www.partiuensaio.automatizeonline.com.br;

    location / {
        return 301 https://partiuensaio.automatizeonline.com.br$request_uri;
    }
}

# Configuração HTTPS
server {
    listen 443 ssl http2;
    server_name partiuensaio.automatizeonline.com.br;

    ssl_certificate /etc/letsencrypt/live/partiuensaio.automatizeonline.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/partiuensaio.automatizeonline.com.br/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    client_max_body_size 10M;

    # ⚠️ IMPORTANTE: Configurações PWA DEVEM estar ANTES de location /
    # Configuração para manifest.json (PWA)
    location = /manifest.json {
        root /var/www/partiu-ensaio/client/build;
        default_type application/manifest+json;
        add_header Content-Type "application/manifest+json; charset=utf-8" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header Access-Control-Allow-Origin "*" always;
        # Desabilitar detecção automática de MIME type para evitar duplicação
        types { }
    }

    # Configuração para service-worker.js (PWA)
    location = /service-worker.js {
        root /var/www/partiu-ensaio/client/build;
        default_type application/javascript;
        add_header Content-Type "application/javascript; charset=utf-8" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header Access-Control-Allow-Origin "*" always;
        # Desabilitar detecção automática de MIME type para evitar duplicação
        types { }
    }

    # Configuração para service-worker.js.map (source map)
    location = /service-worker.js.map {
        root /var/www/partiu-ensaio/client/build;
        default_type application/json;
        add_header Content-Type "application/json; charset=utf-8" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # Configuração para ícones PWA (com cache longo)
    location ~* ^/(icon-|favicon\.ico|apple-touch-icon) {
        root /var/www/partiu-ensaio/client/build;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        expires 1y;
    }

    # Uploads de imagens - DEVE estar ANTES de location / para ter prioridade
    location /uploads {
        alias /var/www/partiu-ensaio/server/uploads;
        
        # Headers CORS para imagens (essencial para PWA)
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type" always;
        
        # Cache moderado (1 dia) para permitir atualizações
        add_header Cache-Control "public, max-age=86400" always;
        expires 1d;
        
        # Content-Type correto para imagens
        types {
            image/jpeg jpg jpeg;
            image/png png;
            image/gif gif;
            image/webp webp;
        }
        default_type image/jpeg;
        
        # Não listar diretório
        autoindex off;
        
        # Log para debug (opcional - pode remover depois)
        access_log /var/log/nginx/uploads-access.log;
        error_log /var/log/nginx/uploads-error.log;
    }

    # Servir arquivos estáticos do React
    location / {
        root /var/www/partiu-ensaio/client/build;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # Arquivos estáticos (JS, CSS, imagens) com cache longo
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp)$ {
        root /var/www/partiu-ensaio/client/build;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # API - Proxy para Node.js
    location /api {
        proxy_pass http://localhost:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # Timeout aumentado para uploads grandes
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

# Redirecionamento de www HTTPS para sem www HTTPS
server {
    listen 443 ssl http2;
    server_name www.partiuensaio.automatizeonline.com.br;

    ssl_certificate /etc/letsencrypt/live/partiuensaio.automatizeonline.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/partiuensaio.automatizeonline.com.br/privkey.pem;

    location / {
        return 301 https://partiuensaio.automatizeonline.com.br$request_uri;
    }
}
