<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/icon-192x192.png" />
    
    <!-- Viewport para mobile -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, user-scalable=yes, viewport-fit=cover" />
    
    <!-- Theme Color -->
    <meta name="theme-color" content="#1a1a1a" />
    <meta name="msapplication-TileColor" content="#D4AF37" />
    
    <!-- Descrição -->
    <meta name="description" content="Agenda musical para ensaios de orquestra. Acesse seus ensaios a qualquer momento!" />
    <meta name="keywords" content="ensaio, música, orquestra, agenda, musical" />
    <meta name="author" content="Partiu Ensaio" />
    
    <!-- PWA - Apple iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Partiu Ensaio" />
    
    <!-- PWA - Android/Chrome -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="Partiu Ensaio" />
    <meta name="msapplication-TileColor" content="#D4AF37" />
    <meta name="msapplication-config" content="/browserconfig.xml" />
    
    <!-- Ícones para iOS -->
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/icon-192x192.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="%PUBLIC_URL%/icon-192x192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="%PUBLIC_URL%/icon-512x512.png" />
    
    <!-- PWA - Windows -->
    <meta name="msapplication-TileImage" content="%PUBLIC_URL%/favicon.ico" />
    
    <!-- Manifest PWA -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    
    <!-- Preconnect para melhor performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    
    <title>Partiu Ensaio - Agenda Musical</title>
    
    <style>
      /* Splash screen para PWA */
      #pwa-splash {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 50%, #D4AF37 100%);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 9999;
        color: white;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        overflow: hidden;
      }
      #pwa-splash.hidden {
        display: none;
      }
      #pwa-splash .logo-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
        margin-bottom: 40px;
      }
      #pwa-splash .logo-img {
        height: 120px;
        width: auto;
        max-width: 90%;
        filter: drop-shadow(0 8px 16px rgba(212, 175, 55, 0.4));
        animation: logoFadeIn 0.8s ease-out, logoFloat 3s ease-in-out infinite;
      }
      #pwa-splash .logo-text {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
      }
      #pwa-splash .logo-text .partiu {
        color: white;
        font-size: 2.5rem;
        font-weight: 800;
        letter-spacing: -1px;
        text-shadow: 0 4px 12px rgba(0, 0, 0, 0.4);
        animation: textFadeIn 1s ease-out 0.3s both;
      }
      #pwa-splash .logo-text .ensaio {
        color: #D4AF37;
        font-size: 2.5rem;
        font-weight: 800;
        letter-spacing: -1px;
        text-shadow: 0 4px 12px rgba(212, 175, 55, 0.5);
        animation: textFadeIn 1s ease-out 0.5s both;
      }
      #pwa-splash .loading {
        width: 50px;
        height: 50px;
        border: 4px solid rgba(212, 175, 55, 0.2);
        border-top-color: #D4AF37;
        border-right-color: #D4AF37;
        border-radius: 50%;
        animation: spin 1s linear infinite, fadeIn 1s ease-out 0.8s both;
        box-shadow: 0 0 20px rgba(212, 175, 55, 0.3);
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      @keyframes logoFadeIn {
        from {
          opacity: 0;
          transform: scale(0.8) translateY(-20px);
        }
        to {
          opacity: 1;
          transform: scale(1) translateY(0);
        }
      }
      @keyframes logoFloat {
        0%, 100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-10px);
        }
      }
      @keyframes textFadeIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      /* Responsivo */
      @media (max-width: 768px) {
        #pwa-splash .logo-img {
          height: 100px;
        }
        #pwa-splash .logo-text .partiu,
        #pwa-splash .logo-text .ensaio {
          font-size: 2rem;
        }
      }
      @media (max-width: 480px) {
        #pwa-splash .logo-img {
          height: 80px;
        }
        #pwa-splash .logo-text .partiu,
        #pwa-splash .logo-text .ensaio {
          font-size: 1.75rem;
        }
        #pwa-splash .loading {
          width: 40px;
          height: 40px;
        }
      }
    </style>
  </head>
  <body>
    <noscript>Você precisa habilitar JavaScript para executar este aplicativo.</noscript>
    
    <!-- Splash Screen para PWA -->
    <div id="pwa-splash">
      <div class="logo-container">
        <img 
          src="/logo.png" 
          alt="Partiu Ensaio" 
          class="logo-img"
        />
        <div class="logo-text">
          <span class="partiu">Partiu</span>
          <span class="ensaio">Ensaio</span>
        </div>
      </div>
      <div class="loading"></div>
    </div>
    
    <div id="root"></div>
    
    <script>
      (function() {
        // Mostrar texto do logo se a imagem não carregar
        var logoImg = document.querySelector('#pwa-splash .logo-img');
        var logoText = document.querySelector('#pwa-splash .logo-text');
        
        if (logoImg && logoText) {
          // Inicialmente ocultar o texto (mostrar apenas se a imagem falhar)
          logoText.style.display = 'none';
          
          logoImg.addEventListener('error', function() {
            this.style.display = 'none';
            logoText.style.display = 'flex';
          });
          
          logoImg.addEventListener('load', function() {
            logoText.style.display = 'none';
          });
          
          // Verificar se a imagem já carregou (pode estar em cache)
          if (logoImg.complete && logoImg.naturalHeight !== 0) {
            logoText.style.display = 'none';
          }
        }
        
        // Esconder splash screen quando a página carregar
        window.addEventListener('load', function() {
          setTimeout(function() {
            var splash = document.getElementById('pwa-splash');
            if (splash) {
              splash.classList.add('hidden');
            }
          }, 1200);
        });
      })();
    </script>
  </body>
</html>
