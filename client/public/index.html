<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/icon-192x192.png" />
    
    <!-- Viewport para mobile -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, user-scalable=yes, viewport-fit=cover" />
    
    <!-- Theme Color -->
    <meta name="theme-color" content="#667eea" />
    <meta name="msapplication-TileColor" content="#667eea" />
    
    <!-- Descrição -->
    <meta name="description" content="Agenda musical para ensaios de orquestra. Acesse seus ensaios a qualquer momento!" />
    <meta name="keywords" content="ensaio, música, orquestra, agenda, musical" />
    <meta name="author" content="Partiu Ensaio" />
    
    <!-- PWA - Apple iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Partiu Ensaio" />
    
    <!-- PWA - Android/Chrome -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="Partiu Ensaio" />
    <meta name="msapplication-TileColor" content="#667eea" />
    <meta name="msapplication-config" content="/browserconfig.xml" />
    
    <!-- Ícones para iOS -->
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/icon-192x192.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="%PUBLIC_URL%/icon-192x192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="%PUBLIC_URL%/icon-512x512.png" />
    
    <!-- PWA - Windows -->
    <meta name="msapplication-TileImage" content="%PUBLIC_URL%/favicon.ico" />
    
    <!-- Manifest PWA -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    
    <!-- Preconnect para melhor performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    
    <title>Partiu Ensaio - Agenda Musical</title>
    
    <style>
      /* Splash screen para PWA */
      #pwa-splash {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 9999;
        color: white;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      }
      #pwa-splash.hidden {
        display: none;
      }
      #pwa-splash .logo {
        font-size: 3rem;
        font-weight: bold;
        margin-bottom: 1rem;
        animation: pulse 2s infinite;
      }
      #pwa-splash .loading {
        width: 40px;
        height: 40px;
        border: 4px solid rgba(255, 255, 255, 0.3);
        border-top-color: white;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.7; }
      }
    </style>
  </head>
  <body>
    <noscript>Você precisa habilitar JavaScript para executar este aplicativo.</noscript>
    
    <!-- Splash Screen para PWA -->
    <div id="pwa-splash">
      <div class="logo">🎵 Partiu Ensaio</div>
      <div class="loading"></div>
    </div>
    
    <div id="root"></div>
    
    <script>
      // Esconder splash screen quando a página carregar
      window.addEventListener('load', function() {
        setTimeout(function() {
          var splash = document.getElementById('pwa-splash');
          if (splash) {
            splash.classList.add('hidden');
          }
        }, 1000);
      });
    </script>
  </body>
</html>
